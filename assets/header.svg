<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-label="Wenhan Chang - MyGO themed banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B1A"/>
      <stop offset="50%" stop-color="#0F1734"/>
      <stop offset="100%" stop-color="#251B4B"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FFB74D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mygo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="60%" stop-color="#FF9F68"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="1400" height="340" fill="url(#bg)"/>

  <!-- Lamp glow (top center / right side) -->
  <circle cx="1030" cy="50" r="240" fill="url(#lamp)"/>
  <circle cx="1250" cy="300" r="200" fill="url(#lamp2)"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="2" fill="#A5B4FC" opacity="0.6"/>
  <circle cx="260" cy="100" r="1.6" fill="#FFD166" opacity="0.5"/>
  <circle cx="420" cy="45" r="2.2" fill="#C4B5FD" opacity="0.55"/>
  <circle cx="560" cy="88" r="1.5" fill="#A5B4FC" opacity="0.45"/>
  <circle cx="700" cy="50" r="2" fill="#FF9F68" opacity="0.5"/>
  <circle cx="860" cy="95" r="1.6" fill="#C4B5FD" opacity="0.4"/>
  <circle cx="300" cy="290" r="2" fill="#FFD166" opacity="0.35"/>
  <circle cx="520" cy="310" r="1.5" fill="#A5B4FC" opacity="0.4"/>
  <circle cx="1350" cy="120" r="2" fill="#FFD166" opacity="0.5"/>
  <circle cx="1190" cy="140" r="1.5" fill="#C4B5FD" opacity="0.45"/>

  <!-- Music notes -->
  <text x="360" y="150" font-family="Georgia, serif" font-size="34" fill="#FFD166" opacity="0.12">♪</text>
  <text x="760" y="270" font-family="Georgia, serif" font-size="30" fill="#FF6B6B" opacity="0.12">♫</text>
  <text x="1335" y="240" font-family="Georgia, serif" font-size="26" fill="#A5B4FC" opacity="0.12">♬</text>

  <!-- Left: name block -->
  <rect x="90" y="116" width="6" height="106" rx="3" fill="url(#mygo)"/>
  <text x="122" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">Wenhan Chang</text>
  <text x="122" y="196" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#A5B4FC">PhD Researcher in AI Safety &amp; Privacy</text>
  <text x="122" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#64748B">Zhongnan University of Economics and Law  |  Wuhan, China</text>

  <!-- Right: MyGO wordmark (layered glow) -->
  <text x="940" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#FFB74D" opacity="0.16">MyGO!!!!!</text>
  <text x="940" y="150" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#FFB74D" opacity="0.3">MyGO!!!!!</text>
  <text x="940" y="150" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#mygo)">MyGO!!!!!</text>

  <!-- Tagline -->
  <text x="942" y="198" font-family="'Segoe UI', 'Hiragino Sans', 'Microsoft YaHei', sans-serif" font-size="21" fill="#FFE9B8">迷子でもいい、迷子でも進め。</text>
  <text x="942" y="228" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7C8DB5">"It's okay to be lost — keep moving anyway."</text>
</svg>
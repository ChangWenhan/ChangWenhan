<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-label="Wenhan Chang - PhD Researcher in AI Safety and Privacy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#141B3B"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C9CF5"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="340" fill="url(#bg)"/>

  <!-- Decorative glows -->
  <circle cx="1180" cy="40" r="260" fill="url(#glowBlue)"/>
  <circle cx="180" cy="330" r="300" fill="url(#glowViolet)"/>
  <circle cx="1330" cy="300" r="180" fill="url(#glowViolet)"/>

  <!-- Star dots -->
  <circle cx="950" cy="70" r="3" fill="#67E8F9" opacity="0.5"/>
  <circle cx="1040" cy="130" r="2" fill="#A5B4FC" opacity="0.6"/>
  <circle cx="1260" cy="90" r="2.5" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="1120" cy="200" r="2" fill="#67E8F9" opacity="0.4"/>
  <circle cx="1340" cy="180" r="3" fill="#A5B4FC" opacity="0.45"/>
  <circle cx="1000" cy="250" r="2" fill="#C4B5FD" opacity="0.4"/>

  <!-- Accent bar -->
  <rect x="80" y="118" width="6" height="104" rx="3" fill="url(#nameGrad)"/>

  <!-- Name -->
  <text x="112" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">Wenhan Chang</text>

  <!-- Subtitle -->
  <text x="112" y="196" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#A5B4FC">PhD Researcher in AI Safety &amp; Privacy</text>

  <!-- Research line -->
  <text x="112" y="236" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#7C8DB5">LLM Safety Alignment   ·   Machine Unlearning   ·   Privacy Preserving   ·   Poisoning Attack &amp; Defense</text>

  <!-- Location line -->
  <text x="112" y="272" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#64748B">Zhongnan University of Economics and Law   |   Wuhan, China</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-label="Wenhan Chang - pink sakura theme banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F7"/>
      <stop offset="50%" stop-color="#FFD9EA"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="60%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4CF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="petalSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9C7E2"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="340" fill="url(#bg)"/>

  <!-- Soft glows -->
  <circle cx="1120" cy="60" r="240" fill="url(#glow)"/>
  <circle cx="180" cy="300" r="260" fill="url(#glow)"/>

  <!-- Sakura flower (large, top-right area) -->
  <g transform="translate(1180 90) rotate(15)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petal)" opacity="0.9"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petal)" opacity="0.9"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petal)" opacity="0.9"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petal)" opacity="0.9"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petal)" opacity="0.9"/></g>
    <circle r="4" fill="#F43F5E"/>
  </g>

  <!-- Sakura flower (small, top-left) -->
  <g transform="translate(200 70) rotate(-20) scale(0.7)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petalSmall)" opacity="0.8"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petalSmall)" opacity="0.8"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petalSmall)" opacity="0.8"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petalSmall)" opacity="0.8"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-15" rx="9" ry="16" fill="url(#petalSmall)" opacity="0.8"/></g>
    <circle r="4" fill="#F43F5E" opacity="0.8"/>
  </g>

  <!-- Falling petals -->
  <ellipse cx="330" cy="250" rx="7" ry="12" fill="#F9A8D4" opacity="0.55" transform="rotate(35 330 250)"/>
  <ellipse cx="480" cy="120" rx="6" ry="10" fill="#F9A8D4" opacity="0.45" transform="rotate(-30 480 120)"/>
  <ellipse cx="880" cy="270" rx="7" ry="12" fill="#FBCFE8" opacity="0.6" transform="rotate(60 880 270)"/>
  <ellipse cx="620" cy="290" rx="6" ry="10" fill="#F9A8D4" opacity="0.5" transform="rotate(-45 620 290)"/>
  <ellipse cx="1300" cy="230" rx="6" ry="10" fill="#FBCFE8" opacity="0.5" transform="rotate(25 1300 230)"/>
  <ellipse cx="1040" cy="280" rx="5" ry="9" fill="#F9A8D4" opacity="0.45" transform="rotate(70 1040 280)"/>

  <!-- Sparkles -->
  <text x="1250" y="200" font-family="Georgia, serif" font-size="26" fill="#EC4899" opacity="0.35">✿</text>
  <text x="150" y="170" font-family="Georgia, serif" font-size="20" fill="#EC4899" opacity="0.3">✿</text>

  <!-- Left: name block -->
  <rect x="90" y="116" width="6" height="106" rx="3" fill="url(#wordmark)"/>
  <text x="122" y="154" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#9D174D">Wenhan Chang</text>
  <text x="122" y="198" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#BE185D">PhD Researcher in AI Safety &amp; Privacy</text>
  <text x="122" y="234" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#A75B8D">Zhongnan University of Economics and Law  |  Wuhan, China</text>

  <!-- Right: MyGO wordmark -->
  <text x="930" y="152" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#EC4899" opacity="0.15">MyGO!!!!!</text>
  <text x="930" y="150" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#EC4899" opacity="0.28">MyGO!!!!!</text>
  <text x="930" y="150" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#wordmark)">MyGO!!!!!</text>

  <!-- Tagline -->
  <text x="932" y="198" font-family="'Segoe UI', 'Hiragino Sans', 'Microsoft YaHei', sans-serif" font-size="21" fill="#9D174D">迷子でもいい、迷子でも進め。</text>
  <text x="932" y="228" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A75B8D">"It's okay to be lost — keep moving anyway."</text>
</svg>